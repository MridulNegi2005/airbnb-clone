services:
  api:
    build: .
    image: airbnb-clone-api
    container_name: airbnb-api
    # Caddy on the host proxies to 127.0.0.1, so the API sees the proxy as a trusted local peer.
    network_mode: host
    env_file: .env
    environment:
      PORT: "8002"
      DATABASE_URL: sqlite:////app/data/airbnb.db
      LOCAL_MEDIA_DIR: /app/data/media
      PUBLIC_BASE_URL: https://airbnb-api.mridulnegi.dev
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
